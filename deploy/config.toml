# Orbit Blockchain Configuration
# Copy to /etc/orbit/config.toml

[network]
network_id = "orbit-devnet"
listen_addr = "0.0.0.0:8333"
bootstrap_peers = [
    # "/ip4/1.2.3.4/tcp/8333/p2p/12D3KooW...",
    # "/ip4/5.6.7.8/tcp/8333/p2p/12D3KooW...",
]
max_peers = 50

[mining]
enabled = true
threads = 1
max_block_time = 500

[rpc]
enabled = true
listen_addr = "127.0.0.1:8545"
cors_origins = ["*"]

[explorer]
enabled = true
listen_addr = "127.0.0.1:3000"

[storage]
data_dir = "/opt/orbit/data"
engine = "json"  # json, rocksdb (future)

[wallet]
name = "Quegmeister"
seed = "NzW8qEyUQg7X"
keystore_path = "/opt/orbit/wallet_keystore.json"
password = ""  # Set in production!

[validator]
enabled = false
keystore_path = "/opt/orbit/validator_keystore.json"
password = ""

[logging]
level = "info"
format = "json"
file = "/opt/orbit/logs/orbit.log"

[metrics]
enabled = true
listen_addr = "127.0.0.1:9090"

# Genesis configuration (auto-generated if not present)
[genesis]
network_id = "orbit-devnet"
chain_id = 1
timestamp = 0
allocations = {
    system = "8190000000000000000"
    lockup_rewards = "10000000000000000"
    mining = "100000000000000000"
    community = "300000000000000000"
    team = "500000000000000000"
    airdrop = "100000000000000000"
    foundation = "200000000000000000"
    partnerships = "100000000000000000"
    reserve = "500000000000000000"
}
mining_params = {
    r_base = "8200000"
    u_target = 10000
    s_max = "100000000000000000"
    b_halflife = 100000
    node_boost_max = 100000
}
validators = []